general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    # lock_cmd = playerctl --all-players pause && pidof hyprlock || hyprlock  # pause all system audio and avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 300                                # 5min - Ekran parlaklığını kıs
    on-timeout = brightnessctl -s set 10         # Parlaklığı minimuma indir
    on-resume = brightnessctl -r                 # Kullanıcı dönünce parlaklığı geri yükle
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
# listener { 
#     timeout = 300                                          # 5min.
#     on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
#     on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
# }

listener {
    timeout = 600                                 # 10min - Oturumu kilitle
    on-timeout = loginctl lock-session            # hyprlock kilit ekranını devreye sok
}

# Not: AMD APU eDP panellerde 'dpms disable' sonrası ekranın uyanamama (siyah kalma) 
# donanım/sürücü hatasını önlemek için DPMS kapatma yerine doğrudan ACPI suspend kullanılır.
listener {
    timeout = 900                                 # 15min - Güvenli uyku modu
    on-timeout = systemctl suspend                # ACPI S3/s2idle ile uyanış garantili uyku
}
